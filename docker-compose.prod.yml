# Production stack: Postgres + backend + frontend behind Caddy (auto-HTTPS).
# Run it with the deploy script, or directly:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443). Everything else talks over the
# internal network. See DEPLOY.md.

# Its own project name so prod volumes/network never collide with the dev
# `docker-compose.yml` if both are ever run from the same checkout.
name: fintell-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: https://${DOMAIN}
    # Apply migrations on every start, then serve.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: the browser hits https://DOMAIN/api/*, Caddy strips
        # /api and forwards to the backend. No CORS needed.
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}/api
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:
